*{box-sizing:border-box}body{margin:0;padding:18px;background:#e9e4d9;color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1160px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font: bold 34px Georgia,serif;margin:0}header p,.sub{font-size:12px;color:var(--muted);margin:5px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--paper);border-radius:22px;padding:9px 14px;font-size:13px}.primary{background:var(--ink);color:white}.danger{color:#a34f48;border-color:#a34f48}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:16px}.page{position:relative;background:var(--paper);border:1px solid #d9d0c1;padding:21px;min-height:680px;box-shadow:0 7px 20px #574a3518;overflow:hidden}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 31px,#cfc5b4 32px,#cfc5b4 33px)}.page>*{position:relative}
h2{font:24px Georgia,serif;margin:0 0 4px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.tools label{font-size:12px;color:var(--muted)}
#map{height:520px;position:relative;overflow:hidden;border:2px solid #958b7b;border-radius:8px;cursor:crosshair;background-color:#f8f3e7;background-image:linear-gradient(#c8c0ae55 1px,transparent 1px),linear-gradient(90deg,#c8c0ae55 1px,transparent 1px);background-size:8.333% 12.5%}
#map:before,#map:after{content:"";position:absolute;pointer-events:none;border:2px dashed #b9af9d;border-radius:50%;width:65%;height:30%;left:12%;top:35%;transform:rotate(-18deg)}#map:after{width:40%;height:60%;left:45%;top:10%;transform:rotate(34deg);border-color:#d1b7a5}
.hint{position:absolute;bottom:9px;left:10px;font-size:11px;color:#8d8374;background:#fffdf0dd;padding:5px 8px;border-radius:12px;pointer-events:none}
.sticker{display:block;background-image:var(--sheet);background-size:500% 900%;background-repeat:no-repeat;width:100%;height:100%}
.marker{position:absolute;z-index:2;transform:translate(-50%,-50%);width:58px;height:58px;border:0;background:transparent;padding:0;filter:drop-shadow(1px 2px 1px #74664b33)}.marker .sticker{width:56px;height:48px}.marker.active{animation:bounce .65s ease 2}@keyframes bounce{50%{translate:0 -11px}}
.pinname{position:absolute;top:43px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;background:#fffdf0e8;border:1px solid #d9d0c1;border-radius:10px;padding:2px 6px;max-width:95px;overflow:hidden;text-overflow:ellipsis}
.righthead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}#filter{max-width:145px;padding:7px;border:1px solid #d9d0c1;border-radius:9px;background:#fffefa;font-size:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-height:590px;overflow:auto;padding:4px}.card{background:#fffefa;border:1px solid #ded7c9;padding:10px;box-shadow:3px 4px 0 #8b806d18;transform:rotate(-.5deg);min-width:0}.card:nth-child(even){transform:rotate(.7deg)}.card.selected{outline:2px solid #c58e80}
.cardtop{display:flex;justify-content:space-between;font-size:10px;color:#968b7b;gap:5px}.cardsticker{width:76px;height:64px;margin:5px auto}.card h3{text-align:center;font-size:15px;margin:3px 0 7px;overflow-wrap:anywhere}.note{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:42px}.photo{width:100%;height:105px;object-fit:cover;margin:6px 0;border:4px solid white}.meta{font-size:10px;color:#968b7b;margin-top:7px;text-align:right}.cardactions{text-align:right;margin-top:7px}.small{border:1px solid #cfc5b5;background:#fffdf5;border-radius:20px;padding:4px 9px;font-size:10px}.empty{grid-column:1/-1;text-align:center;padding:70px 8px;color:#9b9285;font-size:13px}
.backdrop{position:fixed;inset:0;background:#29251f88;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:12px;padding:22px}.modal h2{margin-bottom:4px}.modal p{font-size:12px;color:var(--muted);margin:0 0 15px}
.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d5cbbb;border-radius:8px;background:#fffefa;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.mood{border:1px solid #ded5c6;border-radius:8px;background:#fffefa;padding:4px;min-width:0}.mood.selected{border:2px solid #b87d70;background:#f9e9e4}.mood .sticker{height:48px}.mood small{display:block;text-align:center;font-size:9px;color:#857c70}
#error{font-size:12px;color:#b34e43;min-height:18px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.help{font-size:10px;color:var(--muted)}
@media(max-width:820px){body{padding:10px}.spread{grid-template-columns:1fr}.page{min-height:0}#map{height:420px}.cards{max-height:none}}

</style></head><body><div class="app">
<header><div><h1>Urban Wander</h1><p>把城市裡的小小心情，收進手帳裡。</p></div><div class="actions"><button class="btn" id="weatherBtn">☁ 切換天氣</button><button class="btn danger" id="clearBtn">翻開新頁・清除記錄</button></div></header>
<main class="spread"><section class="page"><h2>01 / Wander Map</h2><p class="sub">點擊地圖任意位置，貼上一個今天的心情。</p>
<div class="tools"><label>手帳日期 <input id="journalDate" type="date"></label><label>天氣 <select id="weather"><option>晴天</option><option>多雲</option><option>陰天</option><option>下雨</option><option>起風</option><option>不記得了</option></select></label></div>
<div id="map"><div class="hint">✎ 點一下地圖，新增地標</div></div>
<div class="map-legend" aria-label="地圖圖例">
  <span><i class="legend-grid" aria-hidden="true"></i> 方格：方便記錄地點位置</span>
  <span><i class="legend-cat" aria-hidden="true">🐱</i> 貓咪貼紙：你收藏的地點</span>
  <span>✎ 點空白處：新增一則回憶</span>
</div></section>
<section class="page"><div class="righthead"><div><h2>02 / Little Memories</h2><p class="sub">每一張卡片，都是一段小小的城市記憶。</p></div><select id="filter"><option value="all">全部表情</option></select></div><div class="cards" id="cards"></div></section></main></div>
<div class="backdrop" id="backdrop"><div class="modal"><h2>留下這一刻</h2><p>替這個座標取個名字，再選一張最像現在心情的貓咪貼紙。</p>
<form id="form"><div class="field"><label for="name">地點名稱 *</label><input id="name" maxlength="40" placeholder="例如：巷口的咖啡店" required></div>
<div class="field"><label for="date">日期與時間 *</label><input id="date" type="datetime-local" required></div>
<div class="field"><label for="reflection">此刻的想法 *</label><textarea id="reflection" maxlength="500" placeholder="寫下一點點今天的感受……" required></textarea></div>
<div class="field"><label>選一個貓咪表情貼紙 *</label><div class="moods" id="moods"></div></div>
<div class="field"><label for="photoInput">照片（選填）</label><input id="photoInput" type="file" accept="image/*"><div class="help">建議選擇 1.5MB 以下的圖片。</div></div>
<div id="error"></div><div class="modalactions"><button type="button" class="btn" id="cancel">先不要</button><button type="submit" class="btn primary">貼進手帳</button></div></form></div></div>
<script>
/* ===== 重要設定 ===== */
const STORAGE_KEY="urbanWanderHandDrawnCatsV6";
const MAX_PHOTO_SIZE=1.5*1024*1024; // 照片上限 1.5MB
const COLS=5, ROWS=9; // 表情圖為 5 欄、9 列，共 45 款
const moodNames=["調皮","愛心","開心","閃亮驚喜","淡定","尷尬","困惑","流淚","微笑","委屈","生氣","吐舌","心動","害羞","搖晃","哭哭","睡著","平靜","小開心","冒花花","閃閃眼","驚訝","叼東西","震驚","緊張","暈暈","流汗","OK","得意","疑惑","無奈","問號","發財夢","撒嬌","期待","難過","心動小眼","臭臉","大眼睛","超開心","驚奇","眨眼","小叉嘴","害怕","嫌棄"];
let records=[],selectedMood=null,mapPoint={x:50,y:50},photoData="",activeId=null;
const $=id=>document.getElementById(id);
function nowLocal(){let d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function sticker(i){let col=i%COLS,row=Math.floor(i/COLS);return `<span class="sticker" style="background-position:${col*25}% ${row*12.5}%"></span>`;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function newId(){return (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():`${Date.now()}-${Math.random()}`;}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}catch(e){alert("瀏覽器儲存空間不足，請刪除部分照片或記錄後再試。");}}
function load(){try{let a=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");records=Array.isArray(a)?a:[];}catch(e){records=[];}}
function setupMoods(){moodNames.forEach((n,i)=>{let b=document.createElement("button");b.type="button";b.className="mood";b.innerHTML=sticker(i)+`<small>${n}</small>`;b.onclick=()=>{selectedMood=i;[...$("moods").children].forEach((x,j)=>x.classList.toggle("selected",i===j));};$("moods").append(b);let o=document.createElement("option");o.value=i;o.textContent=n;$("filter").append(o);});}
function openForm(x,y){mapPoint={x,y};selectedMood=null;photoData="";$("form").reset();$("date").value=nowLocal();$("error").textContent="";[...$("moods").children].forEach(x=>x.classList.remove("selected"));$("backdrop").classList.add("show");$("name").focus();}
function closeForm(){$("backdrop").classList.remove("show");}
function drawMap(){let map=$("map");map.querySelectorAll(".marker").forEach(x=>x.remove());records.forEach(r=>{let b=document.createElement("button");b.className="marker"+(r.id===activeId?" active":"");b.style.left=r.x+"%";b.style.top=r.y+"%";b.title=r.name;b.innerHTML=sticker(r.mood)+`<span class="pinname">${esc(r.name)}</span>`;b.onclick=e=>{e.stopPropagation();selectCard(r.id);};map.append(b);});}
function drawCards(){let root=$("cards"),f=$("filter").value;root.innerHTML="";let list=records.filter(r=>f==="all"||String(r.mood)===f);if(!list.length){root.innerHTML=`<div class="empty">${records.length?"沒有符合這個表情的日記。":"地圖還是空白的。點擊左邊地圖，開始收藏第一個地方吧！"}</div>`;return;}
list.slice().reverse().forEach(r=>{let el=document.createElement("article");el.className="card"+(r.id===activeId?" selected":"");let dt=new Date(r.date).toLocaleString("zh-TW",{dateStyle:"medium",timeStyle:"short"});el.innerHTML=`<div class="cardtop"><span>${esc(dt)}</span><span>${esc(r.weather||"")}</span></div><div class="cardsticker">${sticker(r.mood)}</div><h3>${esc(r.name)}</h3>${r.photo?`<img class="photo" src="${r.photo}" alt="地點照片">`:""}<div class="note">${esc(r.note)}</div><div class="meta">地圖座標 ${Math.round(r.x)}% · ${Math.round(r.y)}%</div><div class="cardactions"><button class="small">撕下這張卡</button></div>`;el.onclick=e=>{if(!e.target.closest(".small"))selectCard(r.id);};el.querySelector(".small").onclick=e=>{e.stopPropagation();if(confirm("確定要撕下這張回憶卡嗎？")){records=records.filter(x=>x.id!==r.id);if(activeId===r.id)activeId=null;save();render();}};$("cards").append(el);});}
function selectCard(id){activeId=id;render();let r=records.find(x=>x.id===id),m=[...$("map").querySelectorAll(".marker")].find(x=>x.title===r?.name);if(m){m.classList.add("active");setTimeout(()=>m.classList.remove("active"),1400);}}
function render(){drawMap();drawCards();}
$("map").onclick=e=>{let r=$("map").getBoundingClientRect();openForm(Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100)),Math.max(5,Math.min(93,(e.clientY-r.top)/r.height*100)));};
$("form").onsubmit=e=>{e.preventDefault();let name=$("name").value.trim(),date=$("date").value,note=$("reflection").value.trim();if(!name||!date||!note){$("error").textContent="請完整填寫地點、日期時間和此刻想法。";return;}if(selectedMood===null){$("error").textContent="記得選一個貓咪表情貼紙喔！";return;}records.push({id:newId(),name,date,note,mood:selectedMood,x:mapPoint.x,y:mapPoint.y,weather:$("weather").value,photo:photoData});save();closeForm();render();};
$("photoInput").onchange=e=>{let f=e.target.files[0];photoData="";if(!f)return;if(f.size>MAX_PHOTO_SIZE){$("error").textContent="照片超過 1.5MB，請換一張較小的圖片。";e.target.value="";return;}let rd=new FileReader();rd.onload=()=>photoData=rd.result;rd.onerror=()=>$("error").textContent="照片讀取失敗，請再試一次。";rd.readAsDataURL(f);};
$("cancel").onclick=closeForm;$("backdrop").onclick=e=>{if(e.target===$("backdrop"))closeForm();};$("filter").onchange=drawCards;
$("clearBtn").onclick=()=>{if(confirm("確定清除所有地標與日記嗎？這個動作無法復原。")){records=[];activeId=null;save();render();}};
$("weatherBtn").onclick=()=>{let a=["晴天","多雲","陰天","下雨","起風","不記得了"],i=a.indexOf($("weather").value);$("weather").value=a[(i+1)%a.length];alert("天氣已設定為："+$("weather").value);};
$("journalDate").value=new Date().toISOString().slice(0,10);setupMoods();load();render();
</script></body></html>
